services:
  - type: web
    name: doctor-scraper-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 3600
    envVars:
      - key: DATABASE_URL
        sync: false          # Set manually in Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false          # Set to your Vercel URL e.g. https://your-app.vercel.app
